name: Render Kahf preview
on:
  workflow_dispatch:
    inputs:
      shards: {description: 'Parallel render workers (max 20)', default: '12'}
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          N=${{ inputs.shards }}; [ "$N" -gt 20 ] && N=20
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Render frame slice
        env:
          I: ${{ matrix.i }}
          K: ${{ inputs.shards }}
        run: |
          N=1476
          RANGE=$(python3 -c "import os;n=$N;k=min(int(os.environ['K']),20);i=int(os.environ['I']);a=n*i//k;b=n*(i+1)//k-1;print(f'{a}-{b}')")
          echo "frames $RANGE of $N"
          npx remotion render src/index.ts Main "out/chunk_$(printf %02d $I).mp4" --frames="$RANGE" --muted \
            --gl=swangle --concurrency=$(nproc) --codec=h264 --crf=14 --pixel-format=yuv420p 2>&1 | tr '\r' '\n' | grep -vE '^\s*$' | tail -5
          ls -la out/chunk_*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: out/chunk_*.mp4
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  join:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Render audio mix
        run: npx remotion render src/index.ts Main out/mix.wav --codec=wav 2>&1 | tr '\r' '\n' | grep -vE '^\s*$' | tail -3
      - uses: actions/download-artifact@v4
        with: {pattern: chunk-*, path: chunks, merge-multiple: true}
      - name: Join chunks + audio
        run: |
          ls chunks/*.mp4 | sort | sed "s|^|file '$PWD/|;s|$|'|" > list.txt
          ffmpeg -nostdin -v error -y -f concat -safe 0 -i list.txt -i out/mix.wav -map 0:v -map 1:a -c:v copy \
            -c:a aac -b:a 256k -ar 48000 -shortest -movflags +faststart out/kahf_preview.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,duration -of compact out/kahf_preview.mp4
      - uses: actions/upload-artifact@v4
        with: {name: kahf-preview, path: out/kahf_preview.mp4, compression-level: 0, retention-days: 30}
